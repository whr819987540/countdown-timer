<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>时间到</title>
    <script type="module" src="/src/alert.ts"></script>
  </head>
  <body>
    <!-- 图标：Phosphor Icons (MIT) -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
      <symbol id="i-bell" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M224,71.1a8,8,0,0,1-10.78-3.42,94.13,94.13,0,0,0-33.46-36.91,8,8,0,1,1,8.54-13.54,111.46,111.46,0,0,1,39.12,43.09A8,8,0,0,1,224,71.1ZM35.71,72a8,8,0,0,0,7.1-4.32A94.13,94.13,0,0,1,76.27,30.77a8,8,0,1,0-8.54-13.54A111.46,111.46,0,0,0,28.61,60.32,8,8,0,0,0,35.71,72Zm186.1,103.94A16,16,0,0,1,208,200H167.2a40,40,0,0,1-78.4,0H48a16,16,0,0,1-13.79-24.06C43.22,160.39,48,138.28,48,112a80,80,0,0,1,160,0C208,138.27,212.78,160.38,221.81,175.94ZM150.62,200H105.38a24,24,0,0,0,45.24,0Z"
        />
      </symbol>
      <symbol id="i-restart" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11-11.63A80,80,0,1,0,71.43,71.39a3.07,3.07,0,0,1-.26.25L44.59,96H72a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V56a8,8,0,0,1,16,0V85.8L60.25,60A96,96,0,0,1,224,128Z"
        />
      </symbol>
      <symbol id="i-stop" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z"
        />
      </symbol>
    </svg>

    <main
      class="alert"
      role="alertdialog"
      aria-labelledby="alert-title"
      aria-describedby="alert-desc"
      data-tauri-drag-region
    >
      <div class="alert-icon" aria-hidden="true" data-tauri-drag-region>
        <svg class="icon" aria-hidden="true"><use href="#i-bell" /></svg>
      </div>
      <h1 class="alert-title" id="alert-title" data-tauri-drag-region>时间到！</h1>
      <p class="alert-desc" id="alert-desc" data-tauri-drag-region>倒计时已结束</p>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="restart">
          <svg class="icon" aria-hidden="true"><use href="#i-restart" /></svg>
          <span>重置</span>
        </button>
        <button type="button" class="btn btn-secondary" id="stop">
          <svg class="icon" aria-hidden="true"><use href="#i-stop" /></svg>
          <span>停止</span>
        </button>
      </div>
      <p class="alert-hint" id="alert-hint" data-tauri-drag-region>重置后将以相同时长重新开始倒计时 · Esc 停止</p>
    </main>
  </body>
</html>
