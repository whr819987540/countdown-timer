[package]
name = "countdown-timer"
version = "0.1.0"
description = "轻量的 Windows 倒计时工具"
authors = ["whr819987540"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio"] }

# 体积优先：安装包和常驻内存都尽量小
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
