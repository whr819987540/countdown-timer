name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 24

jobs:
  frontend:
    name: 前端检查（Biome / tsc / 单元测试 / 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Biome（lint + 格式）
        run: npm run lint
      - name: TypeScript 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: 构建前端
        run: npm run build

  rust:
    name: Rust 检查（fmt / clippy / test）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # tauri::generate_context! 在编译期需要读取前端产物
      - name: 构建前端
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: check

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  build:
    name: 打包 Windows 安装程序
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release

      # rolling 版本号：0.1.<运行序号>，保证每次构建的安装包版本递增，覆盖安装即可升级
      - name: 计算版本号
        id: version
        shell: bash
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # 用私钥为安装包生成更新签名（.sig）；没有私钥时（例如来自 fork 的 PR）只打普通安装包
      - name: tauri build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          updater=false
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && updater=true
          npx tauri build --ci --bundles nsis \
            --config "{\"version\":\"${VERSION}\",\"bundle\":{\"createUpdaterArtifacts\":${updater}}}"

      - name: 整理安装包与更新清单
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          cp "$installer" release/
          # 固定文件名，供 README 中的"永久最新版"下载链接使用
          cp "$installer" release/CountdownTimer-setup.exe
          # 自动更新清单：程序从 rolling 发布读取它，按签名校验带版本号的安装包
          if [ -f "$installer.sig" ]; then
            node -e '
              const fs = require("node:fs");
              const [version, name, sigPath, repo] = process.argv.slice(1);
              const entry = {
                signature: fs.readFileSync(sigPath, "utf8").trim(),
                url: `https://github.com/${repo}/releases/download/rolling/${name}`,
              };
              const manifest = {
                version,
                notes: `Rolling build ${version}`,
                pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64-nsis": entry, "windows-x86_64": entry },
              };
              fs.writeFileSync("release/latest.json", JSON.stringify(manifest, null, 2));
            ' "$VERSION" "$(basename "$installer")" "$installer.sig" "$GITHUB_REPOSITORY"
          else
            echo "::warning::未配置 TAURI_SIGNING_PRIVATE_KEY，本次构建不支持自动更新"
          fi
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: CountdownTimer-windows-x64
          path: |
            release/*.exe
            release/latest.json
          if-no-files-found: error
          retention-days: 14

  # 端到端冒烟测试：安装刚打出的安装包，用 msedgedriver（WebView2 的 WebDriver）像用户一样操作界面，
  # 覆盖开始计时 / 悬浮窗 / 时间到弹窗 / 停止 / 退出等主流程；程序卡死时按超时失败。脚本见 e2e/smoke.ts
  e2e:
    name: 端到端测试（Windows）
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: CountdownTimer-windows-x64
          path: release

      - name: 静默安装
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'CountdownTimer_*_x64-setup.exe' | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'CountdownTimer'
          $exe = Get-ChildItem $dir -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object Name -notlike 'uninstall*' | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $env:LOCALAPPDATA | Out-Host; throw "安装后找不到程序：$dir" }
          Write-Host "已安装：$($exe.FullName)"
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # msedgedriver 必须与 WebView2 运行时版本一致；下载失败时退回 runner 预装的版本
      - name: 准备 msedgedriver
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$client",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client"
          ) | ForEach-Object { (Get-ItemProperty -Path $_ -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ } | Select-Object -First 1
          Write-Host "WebView2 运行时：$version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $driver = $null
          foreach ($base in 'https://msedgedriver.microsoft.com', 'https://msedgedriver.azureedge.net') {
            try {
              Invoke-WebRequest "$base/$version/edgedriver_win64.zip" -OutFile "$dir\driver.zip"
              Expand-Archive "$dir\driver.zip" -DestinationPath $dir -Force
              $driver = Join-Path $dir 'msedgedriver.exe'
              break
            } catch { Write-Host "从 $base 下载失败：$_" }
          }
          if (-not $driver) {
            $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
            Write-Host "::warning::改用 runner 预装的 msedgedriver，版本可能与 WebView2 不一致"
          }
          & $driver --version
          "NATIVE_DRIVER=$driver" >> $env:GITHUB_ENV

      # 附加模式：自己启动程序并打开 WebView2 调试端口，再让 msedgedriver 连上去
      # （Tauri 给 WebView2 指定了自己的数据目录，由驱动启动程序时找不到 DevToolsActivePort 文件）
      - name: 冒烟测试
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e/screenshots | Out-Null
          $log = Join-Path $PWD 'e2e/screenshots/msedgedriver.log'

          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $app = Start-Process -FilePath $env:APP_EXE -PassThru
          Remove-Item Env:\WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          $cdp = $null
          for ($i = 0; $i -lt 60 -and -not $cdp; $i++) {
            try { $cdp = Invoke-RestMethod 'http://127.0.0.1:9222/json/version' -TimeoutSec 2 } catch { Start-Sleep 1 }
          }
          if (-not $cdp) {
            Write-Host "程序进程：$(if ($app.HasExited) { "已退出，退出码 $($app.ExitCode)" } else { '运行中' })"
            throw 'WebView2 调试端口 9222 未打开'
          }
          Write-Host "WebView2：$($cdp.Browser)"
          Invoke-RestMethod 'http://127.0.0.1:9222/json/list' | ForEach-Object { Write-Host "  调试目标：$($_.type) $($_.url)" }

          $driver = Start-Process -FilePath $env:NATIVE_DRIVER -PassThru `
            -ArgumentList '--port=4444', '--verbose', "--log-path=$log"
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            $tcp = [System.Net.Sockets.TcpClient]::new()
            try { $ready = $tcp.ConnectAsync('127.0.0.1', 4444).Wait(500) -and $tcp.Connected } catch {} finally { $tcp.Dispose() }
            if (-not $ready) { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ready) { throw 'msedgedriver 未能启动' }

          $failed = $false
          try {
            $env:APP_PID = $app.Id
            node e2e/smoke.ts 127.0.0.1:9222
            $failed = $LASTEXITCODE -ne 0
          } finally {
            Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue
            if ($failed) { Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 60 | Out-Host }
          }
          if ($failed) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw '冒烟测试失败（截图与驱动日志见构建产物 e2e-screenshots）'
          }
          if (-not $app.WaitForExit(10000)) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            throw '点击「退出程序」后进程仍在运行'
          }

      - name: 上传截图与驱动日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: 发布 rolling release
    needs: [frontend, rust, build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rolling-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CountdownTimer-windows-x64
          path: release

      - name: 生成发布说明
        run: |
          cat > notes.md <<EOF
          滚动发布：\`main\` 分支每次通过全部检查后自动更新，始终是最新构建。

          - 版本：\`${VERSION}\`
          - 提交：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - 构建：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          **安装**：下载 \`CountdownTimer-setup.exe\` 并运行（按当前用户安装，无需管理员权限）。
          安装包未签名，若出现 SmartScreen 提示，请点击"更多信息 → 仍要运行"。
          EOF

      # 先删后建：rolling 标签要指向本次提交。GitHub API 偶发 5xx，创建失败时重试，
      # 避免旧发布已删除而新发布没建成（下载链接和自动更新都会因此失效）
      - name: 替换 rolling release
        run: |
          gh release delete rolling --cleanup-tag --yes || true
          for attempt in 1 2 3 4 5; do
            if gh release create rolling release/* \
              --target "$GITHUB_SHA" \
              --title "Rolling build ${VERSION}" \
              --notes-file notes.md \
              --latest; then
              exit 0
            fi
            echo "::warning::第 ${attempt} 次创建发布失败，稍后重试"
            # 失败的尝试可能留下半成品发布，清理后再试
            gh release delete rolling --cleanup-tag --yes || true
            sleep $((attempt * 20))
          done
          exit 1
