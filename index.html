<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>倒计时</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- 图标：Phosphor Icons (MIT)，内联为 sprite，避免运行时依赖 -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
      <symbol id="i-timer" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M128,40a96,96,0,1,0,96,96A96.11,96.11,0,0,0,128,40Zm0,176a80,80,0,1,1,80-80A80.09,80.09,0,0,1,128,216ZM173.66,90.34a8,8,0,0,1,0,11.32l-40,40a8,8,0,0,1-11.32-11.32l40-40A8,8,0,0,1,173.66,90.34ZM96,16a8,8,0,0,1,8-8h48a8,8,0,0,1,0,16H104A8,8,0,0,1,96,16Z"
        />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M40,88H73a32,32,0,0,0,62,0h81a8,8,0,0,0,0-16H135a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16Zm64-24A16,16,0,1,1,88,80,16,16,0,0,1,104,64ZM216,168H199a32,32,0,0,0-62,0H40a8,8,0,0,0,0,16h97a32,32,0,0,0,62,0h17a8,8,0,0,0,0-16Zm-48,24a16,16,0,1,1,16-16A16,16,0,0,1,168,192Z"
        />
      </symbol>
      <symbol id="i-play" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"
        />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"
        />
      </symbol>
      <symbol id="i-stop" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M216,56V200a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V56A16,16,0,0,1,56,40H200A16,16,0,0,1,216,56Z"
        />
      </symbol>
      <symbol id="i-restart" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11-11.63A80,80,0,1,0,71.43,71.39a3.07,3.07,0,0,1-.26.25L44.59,96H72a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V56a8,8,0,0,1,16,0V85.8L60.25,60A96,96,0,0,1,224,128Z"
        />
      </symbol>
      <symbol id="i-back" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"
        />
      </symbol>
      <symbol id="i-power" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M120,128V48a8,8,0,0,1,16,0v80a8,8,0,0,1-16,0Zm60.37-78.7a8,8,0,0,0-8.74,13.4C194.74,77.77,208,101.57,208,128a80,80,0,0,1-160,0c0-26.43,13.26-50.23,36.37-65.3a8,8,0,0,0-8.74-13.4C47.9,67.38,32,96.06,32,128a96,96,0,0,0,192,0C224,96.06,208.1,67.38,180.37,49.3Z"
        />
      </symbol>
    </svg>

    <div class="shell">
      <main class="app" id="app" data-phase="idle">
        <header class="topbar">
          <h1 class="topbar-title">
            <svg class="icon brand-icon" aria-hidden="true"><use href="#i-timer" /></svg>
            倒计时
          </h1>
          <button
            type="button"
            class="icon-btn"
            id="open-settings"
            aria-label="设置"
            aria-controls="settings"
            aria-expanded="false"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-sliders" /></svg>
          </button>
        </header>

        <section class="dial" aria-label="倒计时">
          <svg class="ring" viewBox="0 0 264 264" aria-hidden="true">
            <circle class="ring-track" cx="132" cy="132" r="120" />
            <circle class="ring-progress" id="ring-progress" cx="132" cy="132" r="120" pathLength="100" />
          </svg>
          <div class="dial-center">
            <p class="status" id="status" aria-live="polite">设置时长</p>
            <fieldset class="time-editor" id="time-editor">
              <legend class="visually-hidden">倒计时时长</legend>
              <label class="time-field">
                <input
                  class="time-input"
                  id="field-h"
                  inputmode="numeric"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="小时"
                  aria-describedby="duration-error"
                  value="00"
                />
                <span class="time-unit" aria-hidden="true">时</span>
              </label>
              <span class="time-colon" aria-hidden="true">:</span>
              <label class="time-field">
                <input
                  class="time-input"
                  id="field-m"
                  inputmode="numeric"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="分钟"
                  aria-describedby="duration-error"
                  value="25"
                />
                <span class="time-unit" aria-hidden="true">分</span>
              </label>
              <span class="time-colon" aria-hidden="true">:</span>
              <label class="time-field">
                <input
                  class="time-input"
                  id="field-s"
                  inputmode="numeric"
                  autocomplete="off"
                  spellcheck="false"
                  aria-label="秒"
                  aria-describedby="duration-error"
                  value="00"
                />
                <span class="time-unit" aria-hidden="true">秒</span>
              </label>
            </fieldset>
            <p class="time-display" id="time-display" role="timer" hidden>25:00</p>
            <p class="meta" id="meta"></p>
          </div>
        </section>

        <div class="controls">
          <fieldset class="presets" id="presets">
            <legend class="visually-hidden">常用时长</legend>
            <button type="button" class="chip" data-minutes="1" aria-pressed="false">1 分钟</button>
            <button type="button" class="chip" data-minutes="3" aria-pressed="false">3 分钟</button>
            <button type="button" class="chip" data-minutes="5" aria-pressed="false">5 分钟</button>
            <button type="button" class="chip" data-minutes="10" aria-pressed="false">10 分钟</button>
            <button type="button" class="chip" data-minutes="25" aria-pressed="false">25 分钟</button>
            <button type="button" class="chip" data-minutes="60" aria-pressed="false">60 分钟</button>
          </fieldset>
          <p class="field-error" id="duration-error" role="alert"></p>
          <div class="actions">
            <button type="button" class="btn btn-primary" id="primary">
              <svg class="icon" aria-hidden="true"><use id="primary-icon" href="#i-play" /></svg>
              <span id="primary-label">开始</span>
            </button>
            <button type="button" class="btn btn-secondary" id="secondary" hidden>
              <svg class="icon" aria-hidden="true"><use href="#i-stop" /></svg>
              <span>停止</span>
            </button>
          </div>
        </div>

        <p class="hint" id="tray-hint">关闭窗口后仍会在托盘中继续计时</p>
      </main>

      <section class="settings" id="settings" aria-labelledby="settings-title" inert>
        <header class="topbar">
          <button type="button" class="icon-btn" id="close-settings" aria-label="返回">
            <svg class="icon" aria-hidden="true"><use href="#i-back" /></svg>
          </button>
          <h2 class="topbar-title" id="settings-title">设置</h2>
        </header>

        <div class="setting-list">
          <label class="setting">
            <span class="setting-text">
              <span class="setting-name">提示音</span>
              <span class="setting-desc">时间到时循环播放系统闹钟声，最长 1 分钟</span>
            </span>
            <input type="checkbox" class="switch" id="opt-sound" />
          </label>
          <label class="setting">
            <span class="setting-text">
              <span class="setting-name">关闭窗口时隐藏到托盘</span>
              <span class="setting-desc">程序在后台继续计时，单击托盘图标即可恢复</span>
            </span>
            <input type="checkbox" class="switch" id="opt-tray" />
          </label>
          <label class="setting">
            <span class="setting-text">
              <span class="setting-name">开机自动启动</span>
              <span class="setting-desc">登录 Windows 后静默驻留在托盘</span>
            </span>
            <input type="checkbox" class="switch" id="opt-autostart" />
          </label>
        </div>
        <p class="field-error" id="settings-error" role="alert"></p>

        <footer class="settings-footer">
          <button type="button" class="btn btn-secondary" id="quit">
            <svg class="icon" aria-hidden="true"><use href="#i-power" /></svg>
            <span>退出程序</span>
          </button>
          <p class="version" id="version"></p>
        </footer>
      </section>
    </div>
  </body>
</html>
