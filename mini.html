<!doctype html>
<html lang="zh-CN">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 透明窗口：不声明 color-scheme，避免深色模式下画布被涂成不透明的深色 -->
    <title>倒计时</title>
    <script type="module" src="/src/mini.ts"></script>
  </head>
  <body>
    <!-- 图标：Phosphor Icons (MIT) -->

    <!-- 只有一个圆形进度环：单击展开主窗口，按住拖动可移动，悬停显示粗略的剩余时间 -->
    <button type="button" class="mini" id="mini" data-phase="running" data-stage="work" aria-label="展开主窗口">
      <svg class="mini-ring" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="ring-disc" cx="24" cy="24" r="23" />
        <g transform="rotate(-90 24 24)">
          <circle class="ring-track" cx="24" cy="24" r="17" />
          <circle class="ring-progress" id="ring" cx="24" cy="24" r="17" pathLength="100" />
        </g>
      </svg>
      <svg class="icon mini-icon" id="mini-icon-svg" aria-hidden="true" hidden>
        <use id="mini-icon" href="#i-pause" />
      </svg>
    </button>
  </body>
</html>
