<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>倒计时</title>
    <script type="module" src="/src/mini.ts"></script>
  </head>
  <body>
    <!-- 图标：Phosphor Icons (MIT) -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden>
      <symbol id="i-play" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"
        />
      </symbol>
      <symbol id="i-pause" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z"
        />
      </symbol>
      <symbol id="i-restart" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M224,128a96,96,0,0,1-94.71,96H128A95.38,95.38,0,0,1,62.1,197.8a8,8,0,0,1,11-11.63A80,80,0,1,0,71.43,71.39a3.07,3.07,0,0,1-.26.25L44.59,96H72a8,8,0,0,1,0,16H24a8,8,0,0,1-8-8V56a8,8,0,0,1,16,0V85.8L60.25,60A96,96,0,0,1,224,128Z"
        />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M247.31,124.76c-.35-.79-8.82-19.58-27.65-38.41C194.57,61.26,162.88,48,128,48S61.43,61.26,36.34,86.35C17.51,105.18,9,124,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208s66.57-13.26,91.66-38.34c18.83-18.83,27.3-37.61,27.65-38.4A8,8,0,0,0,247.31,124.76ZM128,168a40,40,0,1,1,40-40A40,40,0,0,1,128,168Z"
        />
      </symbol>
      <symbol id="i-expand" viewBox="0 0 256 256">
        <path
          fill="currentColor"
          d="M216,48V96a8,8,0,0,1-16,0V67.31l-50.34,50.35a8,8,0,0,1-11.32-11.32L188.69,56H160a8,8,0,0,1,0-16h48A8,8,0,0,1,216,48ZM106.34,138.34,56,188.69V160a8,8,0,0,0-16,0v48a8,8,0,0,0,8,8H96a8,8,0,0,0,0-16H67.31l50.35-50.34a8,8,0,0,0-11.32-11.32Z"
        />
      </symbol>
    </svg>

    <!-- 整个窗口可拖动；非交互元素不接收指针事件，按下时命中带拖动标记的容器 -->
    <main class="mini" id="mini" data-phase="running" data-stage="work" data-tauri-drag-region>
      <svg class="mini-ring" viewBox="0 0 40 40" aria-hidden="true">
        <circle class="ring-track" cx="20" cy="20" r="16" />
        <circle class="ring-progress" id="ring" cx="20" cy="20" r="16" pathLength="100" />
      </svg>
      <div class="mini-text">
        <p class="mini-time" id="time" role="timer">00:00</p>
        <p class="mini-status" id="status" aria-live="polite">倒计时中</p>
      </div>
      <button type="button" class="icon-btn mini-btn" id="primary" aria-label="暂停" title="暂停">
        <svg class="icon" aria-hidden="true"><use id="primary-icon" href="#i-pause" /></svg>
      </button>
      <button
        type="button"
        class="icon-btn mini-btn"
        id="expand"
        aria-label="展开主窗口"
        title="展开主窗口"
      >
        <svg class="icon" aria-hidden="true"><use href="#i-expand" /></svg>
      </button>
    </main>
  </body>
</html>
